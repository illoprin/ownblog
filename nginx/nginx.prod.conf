user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  client_max_body_size 64m;

  # ---------- Gzip ----------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/xhtml+xml
    application/x-font-ttf
    application/x-font-opentype
    application/vnd.ms-fontobject
    image/svg+xml
    image/x-icon
    font/ttf
    font/opentype
    font/woff
    font/woff2;

  # ---------- SSL общие настройки ----------
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  upstream wordpress_backend {
    server wordpress:80;
    keepalive 32;
  }

  # ---------- HTTP: редирект на HTTPS + ACME challenge ----------
  server {
    listen 80;
    listen [::]:80;
    server_name illoprin.ru www.illoprin.ru;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------- HTTPS: основной сервер ----------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name illoprin.ru www.illoprin.ru;

    ssl_certificate /etc/letsencrypt/live/illoprin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/illoprin.ru/privkey.pem;

    access_log /var/log/nginx/wordpress_access.log main;
    error_log /var/log/nginx/wordpress_error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- Кеширование статики на стороне клиента ----------
    # WordPress сам отдаёт файл, nginx просто добавляет заголовки кеша
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|mjs|woff|woff2|ttf|eot|otf|mp4|webm|pdf|zip)$ {
      proxy_pass http://wordpress_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      access_log off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      add_header Vary Accept-Encoding;
    }

    # ---------- Всё остальное: страницы, wp-admin, php и т.д. ----------
    location / {
      proxy_pass http://wordpress_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300;
      proxy_connect_timeout 60;
      proxy_send_timeout 300;
      proxy_buffering on;
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
    }
  }
}